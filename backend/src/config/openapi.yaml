openapi: 3.0.3
info:
  title: AI Study Planner SaaS API
  description: Production-grade API specification for the AI Study Planner application. Handles authentication, dynamic scheduling, AI processing, and learning analytics.
  version: 1.0.0
servers:
  - url: /api
    description: Local development server
paths:
  /auth/register:
    post:
      summary: Register a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minimum: 6
      responses:
        '201':
          description: Registration successful, code sent.
        '400':
          description: Email already registered or invalid fields.

  /auth/verify-email:
    post:
      summary: Verify account using code sent to email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Email verified, access token returned.

  /auth/login:
    post:
      summary: Log in to the application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Access token returned, refresh cookie set.
        '401':
          description: Invalid credentials.
        '423':
          description: Account temporarily locked due to failed attempts.

  /auth/refresh:
    post:
      summary: Rotate and refresh authentication tokens
      responses:
        '200':
          description: New access token generated.
        '401':
          description: Invalid or expired refresh token.

  /auth/logout:
    post:
      summary: Log out and invalidate active refresh tokens
      responses:
        '200':
          description: Logout successful.

  /planner/schedule:
    get:
      summary: Get user's active study schedule
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Retrieved active study plan.
        '404':
          description: Study plan not found.

  /planner/complete:
    patch:
      summary: Mark a task as completed/pending
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dayIndex
                - taskIndex
              properties:
                dayIndex:
                  type: integer
                taskIndex:
                  type: integer
      responses:
        '200':
          description: Task completion status toggled.

  /planner/rebalance:
    post:
      summary: Trigger AI auto-rebalance for missed study sessions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Missed study items redistributed.

  /ai/upload-pdf:
    post:
      summary: Upload syllabus PDF to extract chapters in background
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - subjectId
              properties:
                file:
                  type: string
                  format: binary
                subjectId:
                  type: string
      responses:
        '202':
          description: Job accepted and queued in the background.

  /ai/job/{jobId}:
    get:
      summary: Poll status of a background job
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status details returned (pending, processing, completed, failed).

  /analytics/summary:
    get:
      summary: Retrieve all-time metrics, streaks, burnout, and forecasts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Complete study summary and forecasting metrics.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Subject:
      type: object
      required:
        - _id
        - user
        - name
        - examDate
      properties:
        _id:
          type: string
          example: "64befa3149d01cbfa174ba12"
        user:
          type: string
          example: "64befa3149d01cbfa174ba11"
        name:
          type: string
          example: "Machine Learning"
        examDate:
          type: string
          format: date-time
          example: "2026-08-15T09:00:00.000Z"
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
          example: "Hard"
        color:
          type: string
          example: "#ff4444"
        chapters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Neural Networks"
              estimatedHours:
                type: number
                example: 4
              isCompleted:
                type: boolean
                example: false

    Task:
      type: object
      required:
        - chapterName
        - estimatedHours
        - isCompleted
      properties:
        chapterName:
          type: string
          example: "Neural Networks Overview"
        estimatedHours:
          type: number
          example: 3
        isCompleted:
          type: boolean
          example: false
        isRevision:
          type: boolean
          example: false
        subjectName:
          type: string
          example: "Machine Learning"
        subjectColor:
          type: string
          example: "#ff4444"
        reason:
          type: string
          example: "Prioritized due to close exam date and medium topic complexity."
        stage:
          type: integer
          example: 2

    StudyPlan:
      type: object
      required:
        - user
        - schedule
      properties:
        user:
          type: string
          example: "64befa3149d01cbfa174ba11"
        dailyStudyHours:
          type: number
          example: 4
        schedule:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
                example: "2026-07-28T00:00:00.000Z"
              dayName:
                type: string
                example: "Tuesday"
              isBreakDay:
                type: boolean
                example: false
              tasks:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: "fail"
        message:
          type: string
          example: "Authentication token is missing or expired."
