services:
  mongodb:
    image: mongo:6-jammy
    container_name: study_planner_db
    ports:
      # Bind to 127.0.0.1 so it's accessible locally for tests but not exposed publicly
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - study_planner_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: study_planner_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/studyplanner
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_MODEL=${AI_MODEL:-llama-3.1-8b-instant}
      - AI_INPUT_COST_1M=${AI_INPUT_COST_1M:-0.05}
      - AI_OUTPUT_COST_1M=${AI_OUTPUT_COST_1M:-0.08}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - ENABLE_EMAIL=${EMAIL_ENABLED:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM=${SMTP_FROM}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - ENABLE_GOOGLE_OAUTH=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Backend health check using the readiness endpoint /ready
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - study_planner_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: ./backend
    container_name: study_planner_worker
    command: ["node", "worker.js"]
    environment:
      - PORT=8001
      - WORKER_PORT=8001
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/studyplanner
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - ENABLE_EMAIL=${EMAIL_ENABLED:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_FROM=${SMTP_FROM}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - WORKER_MAX_ATTEMPTS=${WORKER_MAX_ATTEMPTS:-3}
      - WORKER_SHUTDOWN_TIMEOUT_MS=${WORKER_SHUTDOWN_TIMEOUT_MS:-5000}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Worker health check using its HTTP health endpoint on port 8001
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - study_planner_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: study_planner_frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - study_planner_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:

networks:
  study_planner_net:
    driver: bridge
