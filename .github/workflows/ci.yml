name: CI — Lint, Test and Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── BACKEND ───────────────────────────────────────────────────────────────
      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Run Backend Linting (ESLint)
        run: cd backend && npm run lint

      - name: Run Backend Tests + Coverage
        run: cd backend && npm run test:coverage
        env:
          NODE_ENV:           test
          AI_PROVIDER:        mock
          EMAIL_PROVIDER:     mock
          MONGO_URI:          mongodb://localhost:27017/ai-study-planner-ci
          JWT_SECRET:         ci_test_jwt_access_secret_32chars_long_ok_pad
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32chars_long_ok_pad
          GROQ_API_KEY:       gsk_fakekeyforcitesting00000000000000000000000
          CLIENT_URL:         http://localhost:5173
          ALLOWED_ORIGINS:    http://localhost:5173
          APP_VERSION:        "1.0.0"
          EMAIL_ENABLED:      "false"
          ENABLE_EMAIL:       "false"
          GOOGLE_OAUTH_ENABLED: "false"
          ENABLE_GOOGLE_OAUTH: "false"

      # ── FRONTEND ──────────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Run Frontend Linting (Oxlint)
        run: cd frontend && npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: cd frontend && npm run test

      - name: Build Frontend (Production)
        run: cd frontend && npm run build
        env:
          VITE_API_URL: /api

      # ── PLAYWRIGHT E2E ────────────────────────────────────────────────────────
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start Backend for E2E
        run: cd backend && node index.js &
        env:
          PORT:               5000
          NODE_ENV:           test
          AI_PROVIDER:        mock
          EMAIL_PROVIDER:     mock
          MONGO_URI:          mongodb://localhost:27017/ai-study-planner-e2e
          JWT_SECRET:         ci_test_jwt_access_secret_32chars_long_ok_pad
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32chars_long_ok_pad
          GROQ_API_KEY:       gsk_fakekeyforcitesting00000000000000000000000
          CLIENT_URL:         http://localhost:5173
          ALLOWED_ORIGINS:    http://localhost:5173
          APP_VERSION:        "1.0.0"
          EMAIL_ENABLED:      "false"
          ENABLE_EMAIL:       "false"
          GOOGLE_OAUTH_ENABLED: "false"
          ENABLE_GOOGLE_OAUTH: "false"

      - name: Start Frontend for E2E
        run: cd frontend && npm run dev &
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: Wait for API + Frontend Readiness
        run: |
          echo "Waiting for services to be ready..."
          for i in $(seq 1 30); do
            API_OK=$(wget --quiet --spider http://localhost:5000/ready 2>&1 && echo ok || echo fail)
            FE_OK=$(wget --quiet --spider http://localhost:5173 2>&1 && echo ok || echo fail)
            if [ "$API_OK" = "ok" ] && [ "$FE_OK" = "ok" ]; then
              echo "✅ Both services are healthy after $((i * 2)) seconds"
              exit 0
            fi
            echo "Attempt $i: API=$API_OK Frontend=$FE_OK — retrying..."
            sleep 2
          done
          echo "❌ Services did not become ready in 60 seconds"
          exit 1

      - name: Run Playwright E2E Tests
        run: cd frontend && npx playwright test
        env:
          VITE_API_URL: http://localhost:5000/api

      # ── DOCKER BUILDS SMOKE CHECK ─────────────────────────────────────────────
      - name: Build Backend Docker Image
        run: docker build -t ai-study-planner-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: docker build -t ai-study-planner-frontend:latest ./frontend

      # ── ARTIFACT UPLOADS ON FAILURE ───────────────────────────────────────────
      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
