name: CI/CD Production Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Linting
        run: |
          cd backend
          npm run lint

      - name: Run Backend Tests with Coverage
        run: |
          cd backend
          npm run test:coverage
        env:
          JWT_SECRET: ci_test_secret_key_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_54321
          MONGOMS_DISABLE_POSTINSTALL: 0

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linting
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test

      - name: Compile Frontend Production Build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: /api
