name: CI/CD Production Build & Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Security & Scheduling Unit Tests
        run: |
          cd backend
          npm test
        env:
          JWT_SECRET: ci_test_secret_key_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_54321
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: /api
